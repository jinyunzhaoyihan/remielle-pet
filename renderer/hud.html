<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>蕾米埃尔 · HUD</title>
<style>
  /* ===== 蕾米埃尔 HUD v3：桌面级双栏布局（左立绘舞台 / 右常驻面板）
     视觉语言：ZZZ 斜切角 + 大数字 + 斜纹装饰 + conic 状态环，clamp() 全局随窗口缩放 ===== */
  :root {
    --bg0: #14141d; --bg1: #1b1b27; --bg2: #232333; --bg3: #2b2b3d;
    --pink: #ff6b9d; --pink-dim: rgba(255,107,157,.14); --pink-line: rgba(255,107,157,.35);
    --gold: #ffd76e; --cyan: #5ac8ff; --purple: #c86bff; --green: #7dff8a; --red: #ff4757;
    --text: #ececf4; --text-dim: rgba(236,236,244,.62); --text-faint: rgba(236,236,244,.45);
    --cut: 12px;
    --fs-base: clamp(13px, 1.02vw, 17px);
    --fs-title: clamp(17px, 1.55vw, 25px);
    --fs-big: clamp(26px, 2.5vw, 42px);
    --fs-small: clamp(11px, .85vw, 14px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; }
  body { font-family: "Microsoft YaHei", sans-serif; font-size: var(--fs-base); color: var(--text); background: var(--bg0); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a3a52; border-radius: 4px; }

  /* 斜切角（对角两切，ZZZ 标志形） */
  .cut { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
  .cut-sm { clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  /* 斜纹装饰带 */
  .hatch { background: repeating-linear-gradient(-45deg, var(--pink-dim) 0 3px, transparent 3px 10px); }
  .font-num { font-variant-numeric: tabular-nums; }

  /* ===== 标题栏 ===== */
  #titlebar { position: fixed; top: 0; left: 0; right: 0; height: 42px; z-index: 50;
    display: flex; align-items: center; gap: 14px; padding: 0 6px 0 18px;
    -webkit-app-region: drag; background: var(--bg1); }
  #titlebar::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, var(--pink) 0%, rgba(255,107,157,.08) 45%, transparent 70%); }
  .tb-logo { font-weight: bold; letter-spacing: 1px; color: var(--pink); font-size: var(--fs-base); white-space: nowrap; }
  .tb-logo::before { content: '◆'; margin-right: 8px; font-size: .8em; }
  #tb-info { font-size: var(--fs-small); color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-btns { margin-left: auto; display: flex; -webkit-app-region: no-drag; height: 100%; }
  .tb-btn { width: 46px; border: none; background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer; }
  .tb-btn:hover { background: var(--bg3); color: var(--text); }
  .tb-btn.close:hover { background: var(--red); color: #fff; }

  /* ===== 双栏骨架 ===== */
  #frame { position: fixed; inset: 42px 0 0; display: flex; }
  #stage-pane { width: 40%; min-width: 350px; position: relative; overflow: hidden; background: var(--bg1); }
  #info-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg0); border-left: 1px solid rgba(255,107,157,.15); }

  /* ===== 左栏：立绘舞台 ===== */
  /* 舞台轮播层：每组 = blur 衬底（铺满裁切但虚化压暗）+ fit 主体（横图 contain 完整不裁 / 竖图 cover） */
  .scene-group { position: absolute; inset: 0; opacity: 0; transition: opacity 0.7s ease; }
  .scene-group.on { opacity: 1; }
  .scene-group .sg-blur { position: absolute; inset: -24px; background-position: center; background-size: cover; background-repeat: no-repeat;
    filter: blur(26px) brightness(0.55); transform: scale(1.06); }
  .scene-group .sg-fit { position: absolute; inset: 0; background-position: center; background-repeat: no-repeat; }
  body.no-scene #stage-pane { background: radial-gradient(ellipse at 50% 24%, #2a2a40 0%, var(--bg1) 58%, #101018 100%); }
  /* 顶部装饰：斜纹带 + 状态铭牌 */
  .stage-hatch { position: absolute; top: 0; left: 0; right: 0; height: 6px; }
  .stage-tag { position: absolute; top: 18px; right: 0; z-index: 6; padding: 4px 14px 4px 18px;
    background: var(--pink); color: #2a1220; font-size: var(--fs-small); font-weight: bold; letter-spacing: 2px;
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%); }
  /* 等级徽章 + 称号 */
  #lv-badge { position: absolute; top: 16px; left: 18px; z-index: 6; display: flex; align-items: center; gap: 10px; }
  #lv-badge .disc { width: clamp(56px, 4.8vw, 74px); aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(27,27,39,.85); border: 2px solid var(--pink);
    box-shadow: 0 0 18px rgba(255,107,157,.35), inset 0 0 12px rgba(255,107,157,.15); }
  #lv-badge .disc b { font-size: clamp(18px, 1.7vw, 26px); color: var(--pink); font-variant-numeric: tabular-nums; line-height: 1; }
  #lv-badge .disc span { font-size: clamp(8px, .62vw, 10px); color: var(--text-dim); letter-spacing: 2px; }
  #lv-badge .titles { display: flex; flex-direction: column; gap: 4px; }
  #lv-badge .t1 { padding: 3px 12px; background: var(--pink); color: #2a1220; font-weight: bold; font-size: var(--fs-small);
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); width: max-content; }
  #lv-badge .t2 { font-size: var(--fs-small); color: var(--gold); padding-left: 6px; text-shadow: 0 1px 4px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.9); }

  /* 立绘：底部对齐占舞台 88% 高，呼吸动画；hover 1.04 内层 */
  #chara-wrap { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; }
  #chara-box { height: 88%; aspect-ratio: 3 / 4; max-width: 88%; position: relative;
    animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.018); } }
  #chara-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: bottom;
    opacity: 0; transition: opacity .3s ease; -webkit-user-drag: none; }
  #chara-box img.on { opacity: 1; }
  #chara-wrap:hover #chara-box img.on { transform: scale(1.04); transition: transform .25s ease, opacity .3s ease; }
  #chara-fallback { display: none; width: clamp(220px, 19vw, 300px); height: clamp(238px, 20.6vw, 325px); margin-bottom: 6%;
    background-image: url('assets/spritesheet.webp'); background-position: 0 -2925px;
    background-size: 2400px 3575px; background-repeat: no-repeat; animation: breathe 3.2s ease-in-out infinite; }
  body.fallback-chara #chara-box { display: none; }
  body.fallback-chara #chara-fallback { display: block; }
  /* 舞台立绘背景模式：竖版立绘合成图已铺满舞台，立绘层/兜底帧全部让位（台词气泡仍可用） */
  body.portrait-bg #chara-box, body.portrait-bg #chara-fallback { display: none !important; }
  /* 立绘脚部渐变 + 地台线 */
  .stage-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; pointer-events: none;
    background: linear-gradient(to top, var(--bg1) 8%, rgba(27,27,39,.6) 48%, transparent 100%); }
  .stage-line { position: absolute; left: 8%; right: 8%; bottom: clamp(86px, 9.4vw, 128px); height: 2px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--pink-line) 20%, var(--pink-line) 80%, transparent); }

  /* 状态环 ×4：叠在立绘脚下渐变区 */
  #rings { position: absolute; left: 0; right: 0; bottom: clamp(10px, 1.4vw, 22px); z-index: 6;
    display: flex; justify-content: center; gap: clamp(14px, 1.8vw, 30px); }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ring { width: clamp(50px, 4.4vw, 68px); aspect-ratio: 1; border-radius: 50%; position: relative;
    background: conic-gradient(var(--c) calc(var(--v) * 1%), rgba(255,255,255,.09) 0);
    transition: background .4s ease; }
  .ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: rgba(27,27,39,.92); }
  .ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: clamp(12px, 1.05vw, 16px); font-variant-numeric: tabular-nums; color: var(--text); }
  .ring.low { animation: ring-pulse 1s infinite; }
  @keyframes ring-pulse { 50% { filter: brightness(1.5); } }
  .ring-wrap span { font-size: var(--fs-small); color: var(--text-dim); }

  /* 台词气泡 */
  #quote-pop { position: absolute; left: 50%; top: clamp(76px, 9vw, 120px); transform: translateX(-50%) translateY(6px);
    max-width: 74%; padding: 10px 18px; border-radius: 4px 14px 14px 14px; background: rgba(35,35,51,.95);
    border-left: 3px solid var(--pink); font-size: var(--fs-base); line-height: 1.55; color: var(--text);
    box-shadow: 0 8px 28px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 12; }
  #quote-pop.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #quote-pop::before { content: '蕾米'; position: absolute; top: -18px; left: 10px; font-size: var(--fs-small);
    color: var(--pink); font-weight: bold; letter-spacing: 2px; }

  /* ===== 右栏：Tab 导航 + 视图 ===== */
  #tabs { flex: none; display: flex; align-items: stretch; gap: 6px; padding: 12px 16px 0; position: relative; }
  .tab { flex: 1; max-width: 190px; padding: 10px 6px 11px; border: none; cursor: pointer; position: relative;
    background: var(--bg2); color: var(--text-dim); font-size: var(--fs-base); font-weight: bold; letter-spacing: 3px;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    transition: background .18s, color .18s; }
  .tab:hover { background: var(--bg3); color: var(--text); }
  .tab.on { background: linear-gradient(135deg, var(--pink), #ff8fb3); color: #2a1220; }
  .tab .ic { margin-right: 6px; }
  .dot { position: absolute; top: 5px; right: 12px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--red); border: 2px solid #fff; display: none; animation: dot-pulse 2s infinite; }
  .dot.show { display: block; }
  @keyframes dot-pulse { 50% { transform: scale(1.3); } }
  #tab-indicator { position: absolute; bottom: 0; height: 3px; background: var(--pink); transition: left .25s ease, width .25s ease; }

  #views { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; overflow-y: auto; padding: 18px 20px 22px; display: none; }
  .view.on { display: block; animation: view-in .26s ease; }
  @keyframes view-in { from { opacity: 0; transform: translateY(10px); } }

  .v-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .v-title h2 { font-size: var(--fs-title); color: var(--text); letter-spacing: 1px; }
  .v-title h2::before { content: ''; display: inline-block; width: 5px; height: .9em; margin-right: 10px;
    background: var(--pink); transform: skewX(-18deg); vertical-align: -8%; }
  .v-title .sub { font-size: var(--fs-small); color: var(--text-faint); }

  /* 通用斜切卡 */
  .card { background: var(--bg2); padding: 14px 18px; position: relative; }
  .card .corner { position: absolute; top: 0; right: 0; width: 26px; height: 26px;
    background: repeating-linear-gradient(-45deg, rgba(255,107,157,.25) 0 2px, transparent 2px 7px);
    clip-path: polygon(100% 0, 0 0, 100% 100%); }
  .btn { padding: 8px 20px; border: none; cursor: pointer; font-weight: bold; font-size: var(--fs-base);
    background: linear-gradient(135deg, var(--pink), #ff8fb3); color: #2a1220;
    clip-path: polygon(9px 0, 100% 0, calc(100% - 9px) 100%, 0 100%);
    transition: transform .15s, filter .15s; }
  .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.12); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.alt { background: var(--bg3); color: var(--text); outline: 1px solid var(--pink-line); outline-offset: -1px; }

  /* ===== 总览视图 ===== */
  .wallet-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .w-card { padding: 12px 18px 10px; background: var(--bg2); border-left: 3px solid var(--wc, var(--gold)); }
  .w-card .lab { font-size: var(--fs-small); color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .w-card .num { font-size: var(--fs-big); font-weight: bold; color: var(--wc, var(--gold)); font-variant-numeric: tabular-nums; line-height: 1.25; }
  .overview-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; }
  .panel-h { font-size: var(--fs-small); color: var(--text-dim); letter-spacing: 2px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .panel-h::before { content: '▮'; color: var(--pink); font-size: .8em; }
  /* 任务进度卡：环 + 摘要列表 */
  .task-prog { display: flex; gap: 18px; align-items: center; }
  .big-ring { width: clamp(84px, 7.6vw, 118px); aspect-ratio: 1; border-radius: 50%; flex: none; position: relative;
    background: conic-gradient(var(--pink) calc(var(--v) * 1%), rgba(255,255,255,.07) 0); }
  .big-ring::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--bg2); }
  .big-ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: clamp(20px, 1.9vw, 30px); font-variant-numeric: tabular-nums; }
  .big-ring b small { font-size: .5em; color: var(--text-dim); margin-left: 2px; }
  .mini-tasks { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .mini-task { display: flex; align-items: center; gap: 8px; font-size: var(--fs-small); color: var(--text-dim); }
  .mini-task .mk { width: 14px; height: 14px; flex: none; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    background: var(--bg3); }
  .mini-task.done { color: var(--text-faint); text-decoration: line-through; }
  .mini-task.done .mk { background: var(--pink); }
  /* 连签格 */
  .streak-row { display: flex; gap: 8px; margin-top: 4px; }
  .streak-cell { flex: 1; aspect-ratio: 1 / .92; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: var(--bg3); clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .streak-cell.lit { background: linear-gradient(160deg, var(--pink), #c2557e); color: #fff; }
  .streak-cell b { font-size: clamp(13px, 1.15vw, 17px); font-variant-numeric: tabular-nums; }
  .streak-cell span { font-size: clamp(8px, .6vw, 10px); opacity: .75; }
  .streak-note { margin-top: 8px; font-size: var(--fs-small); color: var(--text-faint); }
  /* 快捷卡（最新调频） */
  .latest-pull { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 14px; background: var(--bg3); }
  .latest-pull .tier { font-size: clamp(20px, 1.9vw, 28px); font-weight: bold; font-variant-numeric: tabular-nums; }
  .latest-pull .who { flex: 1; font-size: var(--fs-small); color: var(--text-dim); }
  .latest-pull .tier.S { color: var(--gold); } .latest-pull .tier.A { color: var(--purple); } .latest-pull .tier.B { color: var(--cyan); }

  /* ===== 抽卡视图 ===== */
  .pool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .pool { padding: 16px 18px; background: var(--bg2); }
  .pool.lim { border-left: 3px solid var(--gold); background: linear-gradient(150deg, rgba(255,215,110,.08), var(--bg2) 55%); }
  .pool.std { border-left: 3px solid var(--cyan); }
  .pool .p-kind { font-size: var(--fs-small); letter-spacing: 3px; color: var(--text-faint); }
  .pool .p-name { font-size: var(--fs-title); font-weight: bold; margin: 2px 0 4px; }
  .pool.lim .p-name { color: var(--gold); } .pool.std .p-name { color: var(--cyan); }
  .pool .p-up { font-size: var(--fs-base); margin-bottom: 10px; }
  .pity-line { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: var(--fs-small); color: var(--text-dim); }
  .pity-bar { flex: 1; height: 6px; background: rgba(255,255,255,.08); }
  .pity-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--gold)); }
  .pool .p-btns { display: flex; gap: 8px; }
  .rec-cols { column-count: 2; column-gap: 24px; font-size: var(--fs-small); line-height: 2; color: var(--text-dim); }
  .rec-first { color: var(--gold); background: rgba(255,215,110,.08); padding: 1px 6px; }

  /* ===== 任务视图 ===== */
  .task-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .task-card { padding: 13px 16px; background: var(--bg2); display: flex; align-items: center; gap: 12px;
    border-left: 3px solid var(--pink-line); }
  .task-card.done { opacity: .45; border-left-color: var(--green); }
  .task-card .tk { flex: 1; }
  .task-card .tk b { display: block; font-size: var(--fs-base); }
  .task-card .tk span { font-size: var(--fs-small); color: var(--text-faint); }
  .task-card .st { font-size: var(--fs-small); color: var(--green); font-variant-numeric: tabular-nums; text-align: right; }
  .all-done { grid-column: 1 / -1; padding: 10px; text-align: center; color: var(--gold); font-size: var(--fs-base);
    background: linear-gradient(135deg, rgba(255,215,110,.14), rgba(255,107,157,.08)); outline: 1px solid rgba(255,215,110,.5); outline-offset: -1px; }
  .reward-strip { display: flex; align-items: center; gap: 12px; padding: 12px 18px; margin-top: 12px;
    background: rgba(255,214,110,.07); outline: 1px dashed rgba(255,215,110,.45); outline-offset: -1px;
    font-size: var(--fs-small); color: var(--gold); flex-wrap: wrap; }
  .reward-strip .btn { padding: 5px 14px; font-size: var(--fs-small); }
  .banner { padding: 8px 16px; margin-bottom: 12px; font-size: var(--fs-small); color: var(--gold);
    background: rgba(255,215,110,.07); outline: 1px dashed rgba(255,215,110,.45); outline-offset: -1px; }

  /* ===== 成就视图 ===== */
  .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .ach-cell { display: flex; align-items: center; gap: 12px; padding: 12px 15px; background: var(--bg2); cursor: pointer;
    transition: transform .15s, box-shadow .15s; }
  .ach-cell:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(255,107,157,.25); }
  .ach-cell.on { border-left: 3px solid var(--gold); background: linear-gradient(150deg, rgba(255,215,110,.09), var(--bg2) 60%); }
  .ach-cell:not(.on) { opacity: .75; }
  .ach-cell .ico { font-size: clamp(22px, 2vw, 28px); }
  .ach-cell:not(.on) .ico { filter: grayscale(1); opacity: .45; }
  .ach-cell .nm { font-size: var(--fs-base); }
  .ach-cell .st { font-size: var(--fs-small); color: var(--text-faint); }
  .ach-cell.on .st { color: var(--gold); }

  /* ===== 副本视图 ===== */
  .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .subject-card { padding: 18px; background: var(--bg2); cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .subject-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(255,107,157,.25); }
  .subject-card .ic { font-size: clamp(26px, 2.4vw, 36px); }
  .subject-card .nm { font-size: var(--fs-title); font-weight: bold; margin: 6px 0 2px; }
  .subject-card .ds { font-size: var(--fs-small); color: var(--text-dim); }
  .subject-card .go { margin-top: 10px; font-size: var(--fs-small); color: var(--pink); letter-spacing: 2px; }
  .quiz-q { font-size: clamp(15px, 1.25vw, 19px); line-height: 1.65; margin-bottom: 16px; }
  /* 印章式关卡转场（P2-2）：与聊天窗同款，第 5 关金色 BOSS 印 */
  .dungeon-stamp { display: inline-block; padding: 6px 22px; margin-bottom: 14px; font-size: var(--fs-title); font-weight: bold;
    color: #ff8a8a; border: 2px solid #ff8a8a; border-radius: 10px; transform: rotate(-3deg); letter-spacing: 4px;
    animation: stamp-in .45s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .dungeon-stamp.boss { color: var(--gold); border-color: var(--gold); text-shadow: 0 0 14px rgba(255, 215, 110, 0.65); }
  @keyframes stamp-in { 0% { opacity: 0; transform: scale(2.4) rotate(-14deg); }
    60% { opacity: 1; transform: scale(0.92) rotate(1deg); } 100% { opacity: 1; transform: scale(1) rotate(-3deg); } }
  .dungeon-body { animation: view-in 0.3s ease; }
  .quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quiz-opts button { text-align: left; padding: 13px 18px; border: none; cursor: pointer; font-size: var(--fs-base);
    background: var(--bg2); color: var(--text); clip-path: polygon(9px 0, 100% 0, calc(100% - 9px) 100%, 0 100%);
    transition: background .15s; }
  .quiz-opts button:hover { background: var(--bg3); outline: 1px solid var(--pink); outline-offset: -1px; }
  .stage-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .stage-head .stg { font-size: var(--fs-title); font-weight: bold; color: var(--pink); font-variant-numeric: tabular-nums; }
  .stage-head .rw { font-size: var(--fs-small); color: var(--gold); }
  .stage-head .btn { margin-left: auto; padding: 6px 16px; font-size: var(--fs-small); }
  .quiz-opts button.sel { outline: 2px solid var(--gold); outline-offset: -2px; background: rgba(255, 215, 110, 0.14); }
  .quiz-opts button:disabled { cursor: default; }
  /* 阅读日整篇文章框 + 答后解析卡（v2.3.0 一次作答学习闭环） */
  .quiz-passage { font-size: var(--fs-base); line-height: 1.75; color: var(--text);
    background: var(--bg1); border: 1px solid rgba(255, 107, 157, 0.3); border-radius: 8px;
    padding: 12px 16px; margin-bottom: 14px; max-height: 190px; overflow-y: auto; white-space: pre-wrap; }
  .quiz-ex { font-size: var(--fs-small); line-height: 1.75; color: var(--text-dim);
    background: rgba(90, 200, 255, 0.07); border: 1px solid rgba(90, 200, 255, 0.35); border-radius: 8px;
    padding: 12px 16px; margin-top: 14px; }

  /* ===== 抽卡结果弹层 ===== */
  #pull-overlay { position: fixed; inset: 0; z-index: 80; display: none; background: rgba(12,10,18,.93); }
  #pull-overlay.show { display: block; }
  #pull-stage { height: 100%; overflow-y: auto; padding: 50px 24px; box-sizing: border-box; }
  .pull-tuning { text-align: center; padding: 80px 0 60px; color: var(--pink); letter-spacing: 3px; }
  .pull-tuning .fr { font-size: var(--fs-title); color: var(--gold); font-variant-numeric: tabular-nums; margin-top: 8px; }
  .pull-card { display: flex; align-items: center; gap: 14px; padding: 15px 20px; margin: 0 auto 12px; max-width: 620px;
    opacity: 0; transform: perspective(600px) rotateY(90deg) scale(.85); }
  .pull-card.flip { animation: card-flip .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes card-flip { from { opacity: 0; transform: perspective(600px) rotateY(90deg) scale(.85); } to { opacity: 1; transform: perspective(600px) rotateY(0) scale(1); } }
  .pull-card .lv { font-size: clamp(22px, 2.1vw, 30px); font-weight: bold; width: 38px; text-align: center; }
  .pull-card .nm { font-size: clamp(15px, 1.3vw, 19px); font-weight: bold; }
  .pull-card .ds { font-size: var(--fs-small); margin-top: 2px; opacity: .8; }
  .pull-S { background: linear-gradient(135deg, #3d2a05, #5c3d08); outline: 1.5px solid var(--gold); outline-offset: -1.5px; color: var(--gold); }
  .pull-A { background: linear-gradient(135deg, #2a1740, #3d2260); outline: 1.5px solid var(--purple); outline-offset: -1.5px; color: #e0b3ff; }
  .pull-B { background: rgba(90,160,255,.07); outline: 1.5px solid var(--cyan); outline-offset: -1.5px; color: #a8dcff; }
  .best-tag { margin-left: auto; font-size: var(--fs-small); color: #2a1220; background: var(--gold); padding: 2px 12px; font-weight: bold;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); flex: none; }
  .pull-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 860px; margin: 0 auto 12px; }
  .pull-grid .pull-card { margin: 0; max-width: none; flex-direction: column; text-align: center; padding: 12px 6px; gap: 4px; }
  .pull-grid .pull-card .ds { display: none; }
  .pull-grid .pull-card .lv { width: auto; }
  .pull-grid .pull-card .nm { font-size: var(--fs-small); line-height: 1.35; word-break: break-all; }
  #pull-close { display: block; margin: 18px auto 0; padding: 10px 52px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--pink), #ff8fb3); color: #2a1220; font-weight: bold; font-size: var(--fs-base);
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  #pull-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 81; }

  /* HUD toast */
  #hud-toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 90; max-width: 60%;
    padding: 10px 22px; background: var(--bg2); border-left: 3px solid var(--pink); font-size: var(--fs-base);
    opacity: 0; transition: opacity .3s; pointer-events: none; box-shadow: 0 8px 28px rgba(0,0,0,.5); }

  @media (max-width: 1080px) {
    #stage-pane { min-width: 300px; }
    .overview-grid { grid-template-columns: 1fr; }
    .rec-cols { column-count: 1; }
    .pull-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
  <div id="titlebar">
    <span class="tb-logo">REMIELLE · HUD</span>
    <span id="tb-info">连接中…</span>
    <div class="tb-btns">
      <button class="tb-btn" id="tb-min" title="最小化">─</button>
      <button class="tb-btn" id="tb-max" title="最大化 / 还原">□</button>
      <button class="tb-btn close" id="tb-close" title="关闭">✕</button>
    </div>
  </div>

  <div id="frame">
    <div id="stage-pane">
      <div class="scene-group on" id="sg-a"><div class="sg-blur"></div><div class="sg-fit"></div></div>
      <div class="scene-group" id="sg-b"><div class="sg-blur"></div><div class="sg-fit"></div></div>
      <div class="stage-hatch hatch"></div>
      <div class="stage-tag">REMIELLE</div>
      <div id="lv-badge">
        <div class="disc"><b id="lv-num">-</b><span>LEVEL</span></div>
        <div class="titles"><span class="t1" id="lv-title">-</span><span class="t2" id="lv-exp"></span></div>
      </div>
      <div id="chara-wrap" title="点我试试">
        <div id="quote-pop"></div>
        <div id="chara-box"><img id="chara-a" alt=""><img id="chara-b" alt=""></div>
        <div id="chara-fallback"></div>
      </div>
      <div class="stage-ground"></div>
      <div class="stage-line"></div>
      <div id="rings">
        <div class="ring-wrap"><div class="ring" id="rg-food" style="--c:#ff9a5a"><b>-</b></div><span>饱食</span></div>
        <div class="ring-wrap"><div class="ring" id="rg-drink" style="--c:#5ac8ff"><b>-</b></div><span>口渴</span></div>
        <div class="ring-wrap"><div class="ring" id="rg-feel" style="--c:#ff5ad2"><b>-</b></div><span>心情</span></div>
        <div class="ring-wrap"><div class="ring" id="rg-energy" style="--c:#7dff8a"><b>-</b></div><span>精力</span></div>
      </div>
    </div>

    <div id="info-pane">
      <div id="tabs">
        <button class="tab on" data-view="overview"><span class="ic">◈</span>总览<i class="dot" id="dot-overview"></i></button>
        <button class="tab" data-view="gacha"><span class="ic">🎴</span>抽卡<i class="dot" id="dot-gacha"></i></button>
        <button class="tab" data-view="quiz"><span class="ic">⚔️</span>副本<i class="dot" id="dot-quiz"></i></button>
        <button class="tab" data-view="task"><span class="ic">📋</span>任务<i class="dot" id="dot-task"></i></button>
        <button class="tab" data-view="ach"><span class="ic">🏅</span>成就<i class="dot" id="dot-ach"></i></button>
        <i id="tab-indicator"></i>
      </div>
      <div id="views">
        <div class="view on" id="view-overview"></div>
        <div class="view" id="view-gacha"></div>
        <div class="view" id="view-quiz"></div>
        <div class="view" id="view-task"></div>
        <div class="view" id="view-ach"></div>
      </div>
    </div>
  </div>

  <div id="pull-overlay"><canvas id="pull-canvas"></canvas><div id="pull-stage"></div></div>

<script>
  // ===== HUD v3：双栏桌面布局。数据仍走既有 pet:* IPC（零 handler 重写）；switchView/pickExpr/renderDots
  // 为全局函数（--test-shot 注入断言依赖同名同签名，改签名前先看 main.js 注入串） =====
  let ASSETS = { chara: {}, bg: {}, testRedFlag: false };
  let T = {}, ST = null;
  let curView = 'overview';
  let curExpr = '', blinkTimer = null, blinkLock = false, charaToggle = false;
  const tt = (k, f) => (T && T[k]) || f;
  const $ = (id) => document.getElementById(id);

  const QUOTES = [
    '今天的问答游戏就到此为止了…才怪，还想多陪你一会儿♪',
    '嗯？盯着我看的话，可是要收观光费的哦，共犯。',
    '调频的时候心意相通的概率，会提高一点点哦。大概。',
    '休息也是任务的一部分——这可是前中校的命令。',
    '嘿嘿，被两个人一起宠爱什么的…还、还不赖啦。',
    '别偷懒太久哦？不过，偷懒的时候我在看着，就没关系。'
  ];

  // ===== 舞台背景轮播：池 = bg 目录全部 hud-* 图。横图 contain+blur 衬底（完整不裁切，用户要求），
  // 竖图 cover 铺满。45s 缓慢淡切（不随 Tab 联动，避免跳变）；showStage(n) 供联调注入跳转 =====
  let stagePool = [], stageIdx = 0, stageToggle = false, stageTimer = null;
  function buildStagePool() {
    stagePool = Object.keys(ASSETS.bg).filter((k) => k.startsWith('hud-')).sort().map((k) => ASSETS.bg[k]);
  }
  function showStage(n) {
    if (!stagePool.length) { document.body.classList.add('no-scene'); return; }
    document.body.classList.remove('no-scene');
    stageIdx = ((n % stagePool.length) + stagePool.length) % stagePool.length;
    const file = stagePool[stageIdx];
    const cur = document.querySelector('.scene-group.on') || $('sg-a');
    const next = (cur === $('sg-a')) ? $('sg-b') : $('sg-a');
    if (next.dataset.file === file && next.classList.contains('on')) return;
    const img = new Image();
    img.onload = () => {
      const wide = img.naturalWidth >= img.naturalHeight; // 横图：contain 完整显示（核心要求），衬底虚化补空
      next.querySelector('.sg-blur').style.backgroundImage = 'url("' + file + '")';
      next.querySelector('.sg-fit').style.backgroundImage = 'url("' + file + '")';
      next.querySelector('.sg-fit').style.backgroundSize = wide ? 'contain' : 'cover';
      next.dataset.file = file;
      requestAnimationFrame(() => { next.classList.add('on'); cur.classList.remove('on'); });
    };
    img.src = file;
  }
  function startStageRotation() {
    if (!stagePool.length || stageTimer) return;
    stageTimer = setInterval(() => showStage(stageIdx + 1), 45000);
  }
  function stopStageRotation() {
    if (stageTimer) { clearInterval(stageTimer); stageTimer = null; }
  }
  // Gate A4：轮播开关（cfg.bgRotate，默认关）——每次 ST 更新后应用；关 = 停轮播并回第一张（城堡立绘优先排序）
  function applyStageMode() {
    if (ST && ST.bgRotate) startStageRotation();
    else { stopStageRotation(); showStage(0); }
  }

  // ===== 立绘：表情优先级 + 交叉淡化 + 眨眼 =====
  function pickExpr(st) {
    if (!st) return 'idle';
    if (st.food < 20) return 'hungry';
    if (st.energy < 20) return 'tired';
    if (st.feel >= 80) return 'happy';
    return 'idle';
  }
  function setExpression(st) {
    const want = pickExpr(st);
    if (want === curExpr) return;
    curExpr = want;
    applyCharaSrc(ASSETS.chara[want] || ASSETS.chara.idle || '');
  }
  function applyCharaSrc(src) {
    const a = $('chara-a'), b = $('chara-b');
    if (!src) { document.body.classList.add('fallback-chara'); return; }
    document.body.classList.remove('fallback-chara');
    const show = charaToggle ? a : b, hide = charaToggle ? b : a;
    const img = new Image();
    img.onload = () => { show.src = src; show.classList.add('on'); hide.classList.remove('on'); charaToggle = !charaToggle; };
    img.onerror = () => document.body.classList.add('fallback-chara');
    img.src = src;
  }
  function setupBlink() {
    if (!ASSETS.chara.blink || blinkTimer) return;
    const schedule = () => {
      blinkTimer = setTimeout(() => {
        if (!blinkLock) {
          blinkLock = true;
          const keep = curExpr;
          applyCharaSrc(ASSETS.chara.blink);
          setTimeout(() => { blinkLock = false; applyCharaSrc(ASSETS.chara[keep] || ASSETS.chara.idle || ''); }, 150);
        }
        schedule();
      }, 3000 + Math.random() * 2000);
    };
    schedule();
  }

  // 台词气泡
  let quoteTimer = null;
  $('chara-wrap').addEventListener('click', () => {
    const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    const pop = $('quote-pop');
    pop.textContent = q;
    pop.classList.add('show');
    clearTimeout(quoteTimer);
    quoteTimer = setTimeout(() => pop.classList.remove('show'), 2000);
  });

  // ===== 状态环 =====
  function renderRings(st) {
    if (!st) return;
    for (const k of ['food', 'drink', 'feel', 'energy']) {
      const v = Math.round(st[k]);
      const el = $('rg-' + k);
      el.style.setProperty('--v', v);
      el.querySelector('b').textContent = v;
      el.classList.toggle('low', v < 20);
    }
  }

  // ===== 红点：抽卡=当月剩≤3天；副本=备考未完成；任务=未全完成；成就=常灭；--test-redflag 全亮 =====
  function renderDots(st) {
    const force = ASSETS.testRedFlag;
    const g = (st || {}).gacha || {};
    const done = g.tasks || [];
    const day = new Date().getDate(), dim = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
    const defs = (st || {}).taskDefs || [];
    $('dot-gacha').classList.toggle('show', !!(force || (dim - day) <= 2));
    $('dot-quiz').classList.toggle('show', !!(force || !done.includes('english')));
    $('dot-task').classList.toggle('show', !!(force || (defs.length && !defs.every((t) => done.includes(t.id)))));
    $('dot-overview').classList.remove('show');
    $('dot-ach').classList.remove('show');
  }

  // ===== 视图渲染 =====
  function tierDot(t) { return t === 'S' ? tt('rarity.S', '🟡') : t === 'A' ? tt('rarity.A', '🟣') : tt('rarity.B', '🔵'); }
  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  function renderView(v) {
    if (!ST) return;
    const g = ST.gacha, done = g.tasks || [];
    if (v === 'overview') {
      const defs = ST.taskDefs || [];
      const doneN = defs.filter((t) => done.includes(t.id)).length;
      const pct = defs.length ? Math.round(doneN / defs.length * 100) : 0;
      let h = `<div class="v-title"><h2>指挥官面板</h2><span class="sub">已陪伴 ${Math.max(1, Math.ceil((Date.now() - (g.bornAt || Date.now())) / 86400000))} 天 · 喂食 ${ST.stats.fedTotal || 0} · 打工 ${ST.stats.workTotal || 0} · 聊天 ${ST.stats.chatTotal || 0}</span></div>`;
      h += `<div class="wallet-row">` +
        wCard('丁尼', ST.money, '💰', '#ffd76e') +
        wCard('菲林', g.fil, '🪙', '#ff9a5a') +
        wCard('原装母带', g.stdTapes, '🎞', '#5ac8ff') +
        wCard('加密母带', g.encTapes, '🔐', '#c86bff') + `</div>`;
      h += `<div class="overview-grid"><div class="card"><span class="corner"></span><div class="panel-h">今日任务</div><div class="task-prog">` +
        `<div class="big-ring" style="--v:${pct}"><b>${doneN}<small>/${defs.length}</small></b></div><div class="mini-tasks">` +
        defs.map((t) => `<div class="mini-task${done.includes(t.id) ? ' done' : ''}"><i class="mk"></i>${esc(t.name)}</div>`).join('') +
        `</div></div>` +
        (ST.rewardPending ? `<div class="reward-strip" style="margin-top:12px">🎁 有真人奖励待发放！<button class="btn" data-type="physical">🧋 实物已发</button><button class="btn alt" data-type="later">暂缓</button></div>` : '') +
        `</div>`;
      const streak = Math.min(7, g.loginStreak || 0);
      h += `<div class="card"><span class="corner"></span><div class="panel-h">连续登录</div><div class="streak-row">` +
        Array.from({ length: 7 }, (_x, i) => `<div class="streak-cell${i < streak ? ' lit' : ''}"><b>${i + 1}</b><span>${i === 6 ? '十连' : '天'}</span></div>`).join('') +
        `</div><div class="streak-note">${streak >= 7 ? '🎉 本轮十连已达成！' : '再连签 ' + (7 - streak) + ' 天送加密母带 ×10'}</div></div>`;
      const latest = (g.history || [])[0];
      h += `<div class="card" style="margin-top:12px"><span class="corner"></span><div class="panel-h">最新调频</div>` +
        (latest ? `<div class="latest-pull"><span class="tier ${latest.tier}">${latest.tier}</span><span style="font-weight:bold">${esc(latest.name)}${latest.up ? ' ★UP' : ''}</span><span class="who">${latest.pool === 'lim' ? '限定池' : '常驻池'} · ${new Date(latest.at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</span><button class="btn alt" data-jump="gacha">再去抽一发</button></div>` : `<div class="latest-pull"><span class="who">还没有调频记录——初次的缘分，要试试吗？</span><button class="btn" data-jump="gacha">去抽一发</button></div>`) +
        `</div></div>`;
      $('view-overview').innerHTML = h;
    } else if (v === 'gacha') {
      let h = `<div class="v-title"><h2>小蕾米调频</h2><span class="sub">机制对标《绝区零》· 概率公示见聊天窗</span></div>`;
      h += `<div class="pool-grid">` +
        poolHtml('std', '常规调频', '奖品：奶茶自由券等', '', g.stdPity, g.stdTapes < 1, g.fil < 160) +
        poolHtml('lim', '独家调频 · ' + g.banner.upS.name, 'UP：' + esc(g.banner.upS.desc), g.limGuarantee ? '<b style="color:var(--gold)">大保底必出 UP！</b>' : '50% UP', g.limPity, g.encTapes < 1, g.fil < 160) +
        `</div>`;
      const rec = (g.history || []).slice(0, 12);
      if (rec.length) {
        h += `<div class="v-title" style="margin-top:4px"><h2 style="font-size:var(--fs-base)">调频记录</h2><span class="sub">最近 ${rec.length} 条</span></div><div class="rec-cols">` +
          rec.map((r, i) => {
            const line = `${tierDot(r.tier)} ${esc(r.name)}${r.up ? ' ★UP' : ''} · ${r.pool === 'lim' ? '限定' : '常驻'}`;
            return i === 0 ? `<span class="rec-first">${line} · ${new Date(r.at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })} ✨</span>` : line;
          }).join('<br>') + `</div>`;
      }
      $('view-gacha').innerHTML = h;
    } else if (v === 'task') {
      const defs = ST.taskDefs || [];
      const allDone = defs.length && defs.every((t) => done.includes(t.id));
      let h = `<div class="v-title"><h2>今日任务</h2><span class="sub">${allDone ? '全部完成 🌟' : '完成即得菲林与经验'}</span></div>`;
      if (ST.activity) h += `<div class="banner">🎉 ${esc(ST.activity.name)} 进行中（菲林 ×${ST.activity.filMult}）</div>`;
      h += `<div class="task-grid">`;
      if (allDone) h += `<div class="all-done">今日全部完成 🌟 蕾米今天也很努力！</div>`;
      for (const t of defs) {
        const ok = done.includes(t.id);
        h += `<div class="task-card${ok ? ' done' : ''}"><span class="tk"><b>${esc(t.name)}</b><span>${ok ? '已完成' : '进行中'}</span></span><span class="st">+${t.fil}🪙 · +${t.exp}✨</span></div>`;
      }
      h += `</div>`;
      if (ST.rewardPending) {
        h += `<div class="reward-strip">🎁 <b>有奖励待发放！</b>她升级啦——把实物或情绪价值亲手交给她，然后记录：` +
          `<button class="btn" data-type="physical">🧋 实物奖励已发</button>` +
          `<button class="btn" data-type="emotional">💗 情绪价值已给</button>` +
          `<button class="btn alt" data-type="later">暂缓</button></div>`;
      } else {
        h += `<div class="reward-strip">🎁 ${tt('panel.reward', '真人奖励站')} · 累计：实物 ×${ST.rewards.physical} · 情绪价值 ×${ST.rewards.emotional}<span style="color:var(--text-faint)">（升级时会提醒发放）</span></div>`;
      }
      $('view-task').innerHTML = h;
    } else if (v === 'ach') {
      const defs = ST.achDefs || [];
      const onN = defs.filter((a) => (ST.achievements || []).includes(a.id)).length;
      let h = `<div class="v-title"><h2>成就徽章</h2><span class="sub">${onN} / ${defs.length} 已解锁 · 点击查看详情</span></div><div class="ach-grid">`;
      for (const a of defs) {
        const on = (ST.achievements || []).includes(a.id);
        const when = (ST.achLog || {})[a.id];
        h += `<div class="ach-cell${on ? ' on' : ''}" data-ach="${a.id}" data-icon="${esc(a.icon)}" data-name="${esc(a.name)}" data-hint="${esc(a.hint || '')}" data-on="${on ? 1 : 0}" data-when="${when || ''}">` +
          `<span class="ico">${a.icon}</span><span><div class="nm">${esc(a.name)}</div>` +
          `<div class="st">${on ? (when ? new Date(when).toLocaleDateString('zh-CN') + ' 达成' : '已达成') : '🔒 ' + esc(a.hint || '未解锁')}</div></span></div>`;
      }
      $('view-ach').innerHTML = h + `</div>`;
    } else if (v === 'quiz') {
      if (hudQuizLive) return; // 答题会话进行中：30s 轮询/状态推送的重渲染不得刷掉正在作的题
      const qz = ST.quiz || { daily: {}, stats: {}, week: { fullDays: 0 } };
      const qCards = ['history', 'english', 'politics'].map((s) => {
        const left = Math.max(0, 5 - (qz.daily[s] || 0));
        const qst = (qz.stats || {})[s] || { asked: 0, correct: 0 };
        const acc = qst.asked ? Math.round((qst.correct / qst.asked) * 100) : null;
        return `<div class="subject-card" data-subject="${s}" style="${left ? '' : 'opacity:.45'}">` +
          `<div class="ic">${{ history: '📜', english: '🔤', politics: '🔴' }[s]}</div>` +
          `<div class="nm">${{ history: '历史 · 313 统考风格', english: '英语 · 考研难度', politics: '政治 · 考研题库' }[s]}</div>` +
          `<div class="ds">${left ? `今日还可答 ${left}/5 题` : '今日 5 题已完成 ✓'}${acc != null ? ` · 正确率 ${acc}%` : ''}</div>` +
          (left ? `<div class="go">▶ 开始特训（一次作答，答对得菲林）</div>` : '') + `</div>`;
      }).join('');
      $('view-quiz').innerHTML = `<div class="v-title"><h2>备考副本 · 考研特训</h2><span class="sub">${done.includes('english') ? '✅ 今日任务已完成' : '答满一科 5 题 = 完成今日任务'}</span></div>` +
        `<div class="subject-grid">${qCards}</div>` +
        `<div style="font-size:var(--fs-small);color:var(--text-faint)">🔐 周全勤：本周 ${((qz.week || {}).fullDays) || 0}/5 天三科答满 → 发 1 张加密母带 · 每题只有一次作答机会，答后附解析</div>`;
    }
  }
  function wCard(lab, num, ic, color) {
    return `<div class="w-card" style="--wc:${color}"><div class="lab">${ic} ${lab}</div><div class="num">${num}</div></div>`;
  }
  function poolHtml(kind, name, up, pityPrefix, pity, noTape, noFil) {
    const pct = Math.min(100, Math.round(pity / 90 * 100));
    return `<div class="pool ${kind}"><div class="p-kind">${kind === 'lim' ? 'EXCLUSIVE' : 'STANDARD'} CHANNEL</div>` +
      `<div class="p-name">${name}</div><div class="p-up">${up}</div>` +
      `<div class="pity-line"><span>保底 <b class="font-num" style="color:var(--text)">${pity}</b>/90</span><div class="pity-bar"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>` +
      `<div class="p-btns"><button class="btn" data-pull="${kind}" data-n="1" ${noTape ? 'disabled' : ''}>单抽 ×1</button>` +
      `<button class="btn" data-pull="${kind}" data-n="10" ${noTape ? 'disabled' : ''}>十连 ×10</button>` +
      `<button class="btn alt" data-exch="${kind}" ${noFil ? 'disabled' : ''}>160🪙 兑换</button></div></div>`;
  }

  // ===== Tab 切换（含滑动指示条） =====
  function moveIndicator() {
    const on = document.querySelector('.tab.on');
    const ind = $('tab-indicator');
    if (!on) { ind.style.width = '0'; return; }
    ind.style.left = on.offsetLeft + 'px';
    ind.style.width = on.offsetWidth + 'px';
  }
  function switchView(v) {
    curView = v;
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.view === v));
    document.querySelectorAll('.view').forEach((el) => el.classList.toggle('on', el.id === 'view-' + v));
    moveIndicator();
    renderView(v);
  }
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => switchView(b.dataset.view)));
  window.addEventListener('resize', moveIndicator);

  // ===== 视图内事件委托 =====
  document.getElementById('info-pane').addEventListener('click', async (e) => {
    const b = e.target.closest('button, .ach-cell, .subject-card');
    if (!b) return;
    if (b.dataset.jump) { switchView(b.dataset.jump); return; }
    if (b.classList.contains('ach-cell')) {
      const ds = b.dataset, on = ds.on === '1';
      const when = ds.when ? new Date(Number(ds.when)).toLocaleString('zh-CN') : '';
      return showHudToast(on ? `🏅 ${ds.name} · 已达成${when ? '（' + when + '）' : ''}` : `🏅 ${ds.name} · ${ds.hint || '未解锁，继续加油～'}`, 2600);
    }
    if (b.dataset.pull) {
      const r = await window.pet.gachaPull(b.dataset.pull, Number(b.dataset.n));
      if (r.error === 'notape') return showHudToast('母带不够了，先做任务赚菲林兑换吧');
      showPullResults(r.results);
      refresh();
    } else if (b.dataset.exch) {
      const r = await window.pet.exchange(b.dataset.exch);
      if (r.error === 'nofil') showHudToast('菲林不足 160');
      else { showHudToast('兑换成功！'); refresh(); }
    } else if (b.dataset.type) {
      const r = await window.pet.rewardGrant(b.dataset.type);
      if (r.ok) showHudToast(b.dataset.type === 'later' ? r.quote : '她收到了！' + r.quote);
      refresh();
    } else if (b.dataset.subject) {
      const r = await window.pet.dungeonStart(b.dataset.subject);
      if (r.error === 'quota') return showHudToast('今日该科 5 题已答完，明天再来～');
      if (!r.ok) return showHudToast('副本开启失败');
      if (r.passage) showHudToast('📖 今日是阅读日：一篇考研阅读连出 5 题');
      loadDungeonStage();
    } else if (b.closest('.quiz-opts') && b.dataset.i != null) { // 选项点选：只选中不提交，确认按钮统一一次作答
      if (hudQuizLocked) return;
      const i = Number(b.dataset.i);
      if (hudQuizCtx.multi) {
        const at = hudQuizSel.indexOf(i);
        if (at >= 0) hudQuizSel.splice(at, 1); else hudQuizSel.push(i);
        b.classList.toggle('sel', at < 0);
      } else {
        hudQuizSel = [i];
        b.parentElement.querySelectorAll('button').forEach((x) => x.classList.remove('sel'));
        b.classList.add('sel');
      }
      const c = document.getElementById('hud-quiz-confirm');
      if (c && hudQuizSel.length) { c.disabled = false; c.style.opacity = 1; }
    } else if (b.id === 'hud-quiz-confirm') {
      if (hudQuizLocked || !hudQuizSel.length) return;
      hudQuizLocked = true;
      const r = await window.pet.dungeonSubmit(hudQuizCtx.multi ? hudQuizSel : hudQuizSel[0]);
      if (r.error) { showHudToast('会话已失效，重新出题'); return loadDungeonStage(); }
      hudQuizFinished = !!r.finished;
      renderHudQuizResult(r);
      if (r.weekFull) showHudToast('🔐 周全勤达成！加密母带 ×1 已到账');
    } else if (b.id === 'hud-quiz-next') {
      if (hudQuizFinished) { hudQuizLive = false; refresh(); } else loadDungeonStage();
    } else if (b.dataset.quit) {
      hudQuizLive = false;
      await window.pet.dungeonQuit();
      showHudToast('已放弃（已出的题不退额度）');
      refresh();
    }
  });
  // HUD 端答题会话状态（loadDungeonStage 名称保留供 --test-demo 注入）
  // hudQuizLive：题目/结果停留在视图期间为 true，挡住 renderAll 的周期性重渲染；收工/放弃/失效才回落
  let hudQuizSel = [], hudQuizCtx = null, hudQuizLocked = false, hudQuizFinished = false, hudQuizLive = false;
  async function loadDungeonStage() {
    const q = await window.pet.dungeonQuestion();
    if (q.error) { hudQuizLive = false; refresh(); return; }
    hudQuizCtx = q; hudQuizSel = []; hudQuizLocked = false; hudQuizFinished = false; hudQuizLive = true;
    const letters = ['A', 'B', 'C', 'D'];
    $('view-quiz').innerHTML = `<div class="stage-head"><span class="dungeon-stamp${q.idx === q.total ? ' boss' : ''}">第 ${q.idx} 题${q.idx === q.total ? ' · BOSS' : ''}</span>` +
      `<span class="rw">难度 ${'★'.repeat(q.d)} · ${q.multi ? '多选：全对才得分' : '单选'} · ${q.reward}</span><button class="btn alt" data-quit="1" style="margin-left:auto">放弃</button></div>` +
      (q.passage ? `<div class="quiz-passage">${esc(q.passage)}</div>` : '') +
      `<div class="dungeon-body"><div class="quiz-q">${esc(q.q)}</div><div class="quiz-opts">` +
      q.opts.map((o, i) => `<button data-i="${i}">${letters[i]}. ${esc(o)}</button>`).join('') + `</div>` +
      `<button class="btn" id="hud-quiz-confirm" disabled style="width:100%;margin-top:14px;opacity:.5">确认答案（只有一次机会！）</button></div>`;
  }
  function renderHudQuizResult(r) {
    if (!hudQuizCtx) return;
    const q = hudQuizCtx;
    const letters = ['A', 'B', 'C', 'D'];
    const correctList = q.multi ? r.correctAns : [r.correctAns];
    const optHtml = q.opts.map((o, i) => {
      const isCorrect = correctList.includes(i);
      const isMine = hudQuizSel.includes(i);
      const style = isCorrect ? 'outline:2px solid #7dff8a;background:rgba(125,255,138,.12)' : isMine ? 'outline:2px solid #ff4757;background:rgba(255,71,87,.12)' : 'opacity:.45';
      return `<button disabled style="${style}">${letters[i]}. ${esc(o)}${isCorrect ? ' ✓' : isMine ? ' ✗ 你的选择' : ''}</button>`;
    }).join('');
    $('view-quiz').innerHTML = `<div class="stage-head"><span class="dungeon-stamp">第 ${q.idx}/${q.total} 题 · 解析</span>` +
      `<span class="rw">${r.pass ? '+' + r.filGot + '🪙 +' + r.expGot + '✨' : '答错无菲林 · 1✨ 安慰奖'}</span></div>` +
      `<div class="dungeon-body"><div style="font-size:var(--fs-title);font-weight:bold;color:${r.pass ? '#7dff8a' : '#ff4757'};margin-bottom:12px">${r.pass ? '✓ 答对了！' : '✗ 答错了（一次作答机会已用）'}</div>` +
      `<div class="quiz-q">${esc(q.q)}</div><div class="quiz-opts">${optHtml}</div>` +
      `<div class="quiz-ex">💡 ${esc(r.ex)}</div>` +
      (r.finished
        ? `<div style="font-size:var(--fs-base);color:var(--text);margin:14px 0">🎉 今日 ${q.subject} 训练完成：答对 ${r.correctCount}/${q.total}${r.weekFull ? '<br>🔐 本周第 5 个全勤日达成，加密母带 ×1 已到账！' : ''}</div>` +
          `<button class="btn" id="hud-quiz-next" style="width:100%">完成</button>`
        : `<button class="btn" id="hud-quiz-next" style="width:100%;margin-top:4px">下一题（还剩 ${r.remaining} 题）</button>`) +
      `</div>`;
  }

  let hudToastEl = null, hudToastTimer = null;
  function showHudToast(msg, ms) {
    if (!hudToastEl) {
      hudToastEl = document.createElement('div');
      hudToastEl.id = 'hud-toast';
      document.body.appendChild(hudToastEl);
    }
    hudToastEl.textContent = msg;
    hudToastEl.style.opacity = '1';
    clearTimeout(hudToastTimer);
    hudToastTimer = setTimeout(() => { hudToastEl.style.opacity = '0'; }, ms || 2400);
  }

  // ===== 抽卡结果弹层（调频动画 → 最佳置顶 + 5 列网格 → 金紫粒子） =====
  let confettiRAF = null, confettiParts = [];
  function confettiBurst(colors, n) {
    const cv = $('pull-canvas');
    cv.width = innerWidth; cv.height = innerHeight;
    const cx = cv.width / 2, cy = cv.height * 0.3;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
      confettiParts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, g: 0.18, life: 60 + Math.random() * 40, size: 3 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)], rot: Math.random() * Math.PI });
    }
    if (!confettiRAF) runConfetti();
  }
  function runConfetti() {
    const cv = $('pull-canvas'), ctx = cv.getContext('2d');
    const step = () => {
      ctx.clearRect(0, 0, cv.width, cv.height);
      confettiParts = confettiParts.filter((p) => p.life > 0);
      for (const p of confettiParts) {
        p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= 1; p.rot += 0.12;
        ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 30));
        ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6); ctx.restore();
      }
      if (confettiParts.length) confettiRAF = requestAnimationFrame(step);
      else { confettiRAF = null; ctx.clearRect(0, 0, cv.width, cv.height); }
    };
    confettiRAF = requestAnimationFrame(step);
  }
  function showPullResults(results) {
    const ov = $('pull-overlay'), stage = $('pull-stage');
    ov.classList.add('show');
    stage.innerHTML = `<div class="pull-tuning"><div>正在调频</div><div class="fr">FM <span id="pull-fr">88.0</span></div><div style="font-size:var(--fs-small);color:var(--text-dim);margin-top:8px">搜索她的心意信号…</div></div>`;
    const frEl = $('pull-fr');
    const frTimer = setInterval(() => { frEl.textContent = (88 + Math.random() * 20).toFixed(1); }, 70);
    setTimeout(() => {
      clearInterval(frTimer);
      const tw = { S: 3, A: 2, B: 1 };
      let bestIdx = 0;
      results.forEach((r, i) => { if (tw[r.tier] * 10 + (r.up ? 1 : 0) > tw[results[bestIdx].tier] * 10 + (results[bestIdx].up ? 1 : 0)) bestIdx = i; });
      const many = results.length > 1, best = results[bestIdx];
      const card = (r) => `<div class="pull-card pull-${r.tier}"><span class="lv">${r.tier}</span><div><div class="nm">${esc(r.name)}${r.up ? ' ★UP' : ''}</div><div class="ds">${esc(r.desc)}</div></div></div>`;
      let html = '';
      if (many) {
        html += `<div class="pull-card pull-${best.tier}" id="pull-best" style="max-width:860px"><span class="lv">${best.tier}</span><div><div class="nm">${esc(best.name)}${best.up ? ' ★UP' : ''}</div><div class="ds">${esc(best.desc)}</div></div><span class="best-tag">本次最佳</span></div>`;
        html += `<div class="pull-grid">` + results.filter((_r, i) => i !== bestIdx).map(card).join('') + `</div>`;
      } else html += card(best);
      html += `<button id="pull-close">${best.tier === 'S' ? '收下这份心意 🌟' : '收下'}</button>`;
      stage.innerHTML = html;
      const cards = stage.querySelectorAll('.pull-card');
      cards.forEach((c, i) => {
        setTimeout(() => {
          c.classList.add('flip');
          if (c.id !== 'pull-best' && many) return;
          if (best.tier === 'S') confettiBurst(['#ffd76e', '#ffb84d', '#fff2b3', '#ff6b9d'], 150);
          else if (best.tier === 'A') confettiBurst(['#c86bff', '#e0b3ff', '#ff6b9d'], 50);
        }, 350 + i * 140);
      });
      setTimeout(() => {
        const gc = $('pull-close');
        if (gc) gc.style.visibility = 'visible';
        ov.addEventListener('click', closePull);
      }, 350 + cards.length * 140 + 400);
    }, 1100);
  }
  function closePull() {
    const ov = $('pull-overlay');
    if (!ov.classList.contains('show')) return;
    ov.classList.remove('show');
    ov.removeEventListener('click', closePull);
    confettiParts = [];
  }

  // ===== 数据刷新 =====
  function renderAll() {
    if (!ST) return;
    const g = ST.gacha || {};
    $('tb-info').textContent = `Lv.${ST.level} · ${ST.title} · 💰${ST.money} · 🪙${g.fil || 0}`;
    $('lv-num').textContent = ST.level;
    $('lv-title').textContent = ST.title;
    const pct = Math.min(100, Math.round(ST.exp / ST.expNext * 100));
    $('lv-exp').textContent = `EXP ${pct}%`;
    renderRings(ST);
    setExpression(ST);
    renderDots(ST);
    renderView(curView);
  }
  async function refresh() {
    try { ST = await window.pet.nurtureState(); } catch (_e) { return; }
    applyStageMode();
    renderAll();
  }
  window.pet.onHudState((st) => { ST = st; applyStageMode(); renderAll(); });
  window.pet.onTaskDone(() => refresh());
  window.pet.onStateLow(() => refresh());
  window.pet.onWarehouseChanged(() => refresh()); // 兑现确认/经济修正后同步

  // ===== 窗口控制 + 初始化 =====
  $('tb-min').addEventListener('click', () => window.pet.hudMinimize());
  $('tb-max').addEventListener('click', () => window.pet.hudMaximize());
  $('tb-close').addEventListener('click', () => window.pet.hudClose());
  window.pet.onHudMaximized((v) => { $('tb-max').textContent = v ? '❐' : '□'; });
  (async () => {
    try { T = (await window.pet.getI18n()) || {}; } catch (_e) { T = {}; }
    try { ASSETS = (await window.pet.hudInit()) || { chara: {}, bg: {} }; } catch (_e) { ASSETS = { chara: {}, bg: {}, testRedFlag: false }; }
    // 舞台立绘背景模式：竖版立绘合成图已铺满舞台时，隐藏雪碧图兜底（避免重复立绘）
    if (ASSETS.bg['hud-portrait']) document.body.classList.add('portrait-bg');
    buildStagePool(); showStage(0); // 轮播由 applyStageMode 按 ST.bgRotate 决定（默认关）
    applyCharaSrc(ASSETS.chara.idle || '');
    setupBlink();
    await refresh();
    moveIndicator();
    setInterval(refresh, 30000);
  })();
</script>
</body>
</html>
